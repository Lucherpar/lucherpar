name: Generar serpiente de contribuciones

on:
  # Se ejecuta cada día a medianoche
  schedule:
    - cron: "0 0 * * *"
  # Permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta al subir cambios a la rama principal
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar los SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
